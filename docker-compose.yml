services:
  # PostgreSQL 데이터베이스
  db:
    image: postgres:16
    container_name: ktravel_postgres
    environment:
      POSTGRES_DB: ktravel
      POSTGRES_USER: ktravel_user
      POSTGRES_PASSWORD: ktravel_password
    ports:
      - "5432:5432"
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ktravel_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ktravel_user -d ktravel"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis (세션 저장소)
  redis:
    image: redis:7-alpine
    container_name: ktravel_redis
    ports:
      - "6379:6379"
    networks:
      - ktravel_network
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

  # FastAPI 백엔드
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ktravel_backend
    environment:
      - DATABASE_HOST=db
      - DATABASE_PORT=5432
      - DATABASE_NAME=ktravel
      - DATABASE_USER=ktravel_user
      - DATABASE_PASSWORD=ktravel_password
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=your-super-secret-key-change-in-production-min-32-chars
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - SESSION_EXPIRE_HOURS=24
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - ODSAY_API_KEY=${ODSAY_API_KEY}
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_API_KEY=
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - ktravel_network
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    env_file:
      - .env

  # React 프론트엔드
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ktravel_frontend
    environment:
      - REACT_APP_API_URL=http://localhost:8000
      - CHOKIDAR_USEPOLLING=true
    ports:
      - "3000:3000"
    volumes:
      - /app/node_modules
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    depends_on:
      - backend
    networks:
      - ktravel_network
    stdin_open: true
    tty: true

networks:
  ktravel_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data: